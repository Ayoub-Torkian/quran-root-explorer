   </g>
   <g id="text_9">
    <text style="font-style: italic; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #10243a" x="85.45194" y="258.282" transform="rotate(-0 85.45194 258.282)">'indeed YOUR hater is the cut-off one'</text>
