   </g>
   <g id="text_3">
    <text style="font-style: italic; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #10243a" x="85.45194" y="98.9748" transform="rotate(-0 85.45194 98.9748)">'Indeed WE gave YOU the abundance'</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #1d9e75" x="476.71164" y="88.5852" transform="rotate(-0 476.71164 88.5852)">God → Prophet : the gift</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #10243a" x="85.45194" y="157.8492" transform="rotate(-0 85.45194 157.8492)">V2.  fa-ṣalli li-rabbi-ka wa-nḥar</text>
   </g>
   <g id="text_6">
