    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #0f6e56" transform="translate(367.801328 173.866254)">ROBUST FACT: the rare hate-root ﺀﻦﺷ occurs in only</text>
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #0f6e56" transform="translate(383.513202 187.160613)">sūras 5 (al-Māʾida) and 108 (al-Kawthar) of 114 —</text>
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #0f6e56" transform="translate(339.761093 200.038097)">al-Māʾida is al-Kawthar's unique lexical twin (p≈0.0005).</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #1d3557" transform="translate(55.976125 16.698047)">Figure 9.  Robustness: 'al-Māʾida ranks #1 as al-Kawthar's elaborator' is NOT robust.</text>
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #1d3557" transform="translate(55.976125 30.792969)">Length-norm OFF -&gt; #1 (merely rewards a long sūra); ON -&gt; al-Māʾida falls to 3-22 (al-Ḍuḥā leads).</text>
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #1d3557" transform="translate(55.976125 44.887891)">The robust claim is the discrete fact below, not a continuous ranking.</text>
