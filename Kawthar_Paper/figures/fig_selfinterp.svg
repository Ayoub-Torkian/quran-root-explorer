   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; fill: #1d3557" transform="translate(7.2 18.66375)">Figure 12.  Self-interpretation, directed (ﻥﺁﺮﻘﻟﺍ ﺮﺴﻔﻳ ﻪﻀﻌﺑ ﺎﻀﻌﺑ).  Arrow a→b = "a reliably accompanies b" P(a|b).</text>
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; fill: #1d3557" transform="translate(7.2 32.536125)">ﺮﺘﺑ co-occurs with ﺀﻦﺷ (the only ﺮﺘﺑ verse is a ﺀﻦﺷ verse); these conditionals rest on single</text>
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; fill: #1d3557" transform="translate(7.2 46.4085)">co-occurrences (n=1) — suggestive, not significant except ﺮﺘﺑ–ﺀﻦﺷ (p≈0.0005). See §5.26.</text>
   </g>
